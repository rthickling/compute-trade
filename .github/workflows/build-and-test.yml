name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.toolchain.name }} / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.toolchain.image }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
        toolchain:
          - name: GCC 16.2
            image: gcc:16.2.0-trixie
            cxx: g++
          - name: Clang 22
            image: silkeh/clang:22-trixie
            cxx: clang++

    defaults:
      run:
        shell: bash
        working-directory: compute-trade
    env:
      CXX: ${{ matrix.toolchain.cxx }}
      CMAKE_BUILD_PARALLEL_LEVEL: 2

    steps:
      - name: Check out Compute Trade
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: compute-trade
          persist-credentials: false

      # Keep this revision aligned with the baseline documented in README.md.
      # Sibling checkouts preserve the same ../simplx layout used locally.
      - name: Check out Simplx
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: rthickling/simplx
          ref: c0b2ca712f1c187b6c120d5bcaf441bdff1600ae
          path: simplx
          persist-credentials: false
          submodules: false

      - name: Install build and test tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends cmake ninja-build python3

      - name: Verify generated SBE codecs
        if: matrix.toolchain.cxx == 'g++' && matrix.preset == 'debug'
        run: |
          apt-get install --yes --no-install-recommends openjdk-21-jre-headless ca-certificates
          python3 tools/generate_sbe.py --check

      - name: Show toolchain
        run: |
          "$CXX" --version
          cmake --version
          python3 --version

      - name: Configure
        run: cmake --preset "${{ matrix.preset }}"

      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}" --parallel

      - name: Test
        run: ctest --preset "${{ matrix.preset }}" --timeout 60
